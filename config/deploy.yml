# Name of your application. Used to uniquely configure containers.
service: morning-boucalot

# Name of the container image.
image: troptropcontent/morning-boucalot

# Deploy to these servers.
servers:
  web:
    - 51.178.142.109
  job:
    hosts:
      - 51.178.142.109
    cmd: bin/jobs

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# Note: If using Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
proxy:
  ssl: true
  host: www.morningboucalot.com
  app_port: 3000

ssh:
  user: ubuntu

# Credentials for your image host.
registry:
  username: troptropcontent
  password:
    - KAMAL_REGISTRY_PASSWORD

# Configure builder setup.
builder:
  arch: amd64

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  clear:
    RAILS_SERVE_STATIC_FILES: "true"
    # Keep in sync with proxy.host above.
    APP_HOST: www.morningboucalot.com
    # Where the web/job containers read FTP-offloaded files from. vsftpd
    # runs directly on the VPS (not in Docker) and writes into the host
    # folder bind-mounted below at the same container path — see the FTP
    # setup notes near the bottom of this file.
    FTP_INCOMING_DIR: /data/ftp_incoming
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - QUEUE_DATABASE_URL
    - S3_ACCESS_KEY_ID
    - S3_SECRET_ACCESS_KEY
    - S3_REGION
    - S3_BUCKET_NAME
    - S3_ENDPOINT
    - S3_FORCE_PATH_STYLE
    - GMAIL_USERNAME
    - GMAIL_APP_PASSWORD
    - FTP_INGEST_USER_EMAIL
    - OFFLOAD_UPLOAD_TOKEN

# Bind-mount the host folder vsftpd writes into, so the app containers can
# read the same files. Host path (left) is just a convention — pick
# whatever directory you actually create on the VPS for this.
volumes:
  - "/srv/ftp_incoming:/data/ftp_incoming"

# Bridge fingerprinted assets between versions to avoid 404s on in-flight requests.
# asset_path: /rails/public/assets

# --- HTTPS offload upload (replacing FTP, see docs/ftp_offload_setup.md) ---
# POST /offload_uploads with a Bearer <OFFLOAD_UPLOAD_TOKEN> header and a
# multipart `file` param ingests a shot the same way the FTP path does, into
# the same unpublished review queue. Needs OFFLOAD_UPLOAD_TOKEN (above) and
# FTP_INGEST_USER_EMAIL (already set below) -- no other setup. Meant for a
# phone-side upload utility to call instead of the laptop+FTP script. Kept
# running alongside FTP for now; FTP gets retired once the phone utility is
# verified working end-to-end.

# --- FTP setup (not managed by Kamal) ---
# The X-E5 offload feature needs vsftpd installed directly on the VPS
# (51.178.142.109), *outside* of Docker/Kamal — run bin/setup_ftp_server
# on the VPS itself (see that script's header for the required env vars).
# It's idempotent: re-run it any time config/vsftpd.conf changes, or after
# rebuilding the VPS from scratch.
#
# Still needed after that:
#   - Open port 21 and the passive port range (default 30000-30009) in the
#     VPS firewall.
#   - Point the X-E5's FTP transfer settings (host, port, FTPES, the
#     username/password you gave the script) at this server.
#   - Set FTP_INGEST_USER_EMAIL above — the app user (your member
#     account's email) that offloaded photos get attributed to. This is
#     unrelated to the FTP login itself; the app never needs that
#     password, it only reads files that land in the shared folder.

# Aliases are triggered with "bin/kamal <alias>".
aliases:
  shell: app exec --interactive --reuse "bash"
  console: app exec --interactive --reuse "bin/rails console"
  logs: app logs -f