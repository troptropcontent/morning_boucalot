# vsftpd config for the X-E5 FTP offload feature.
#
# Templated by bin/setup_ftp_server — the __ALL_CAPS__ placeholders below
# get substituted with real values when that script runs. If you ever edit
# /etc/vsftpd.conf by hand on the server, re-running the script will
# overwrite it — make changes here and re-run instead.

listen=YES
listen_ipv6=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES

# vsftpd refuses to let a system user without a real login shell in unless
# told not to check — the dedicated FTP user created by the setup script
# has /usr/sbin/nologin on purpose (it should never be able to SSH in).
check_shell=NO

# Single dedicated FTP user (created by the setup script), locked to its
# own folder — it can't see or write anywhere else on the server.
chroot_local_user=YES
allow_writeable_chroot=YES
local_root=__FTP_INCOMING_DIR__

# Passive mode: the camera opens the data connection back to us, so vsftpd
# has to advertise our real address and a fixed port range — open that
# same range in the VPS firewall, alongside port 21.
pasv_enable=YES
pasv_address=__PASV_ADDRESS__
pasv_min_port=__PASV_MIN_PORT__
pasv_max_port=__PASV_MAX_PORT__

# FTPES: encrypted login + transfer over ordinary port 21 (not implicit
# FTPS on 990). Set the camera to "FTPES" / "FTP over TLS (explicit)".
ssl_enable=YES
ssl_tlsv1_2=YES
rsa_cert_file=__SSL_CERT_FILE__
rsa_private_key_file=__SSL_KEY_FILE__
force_local_data_ssl=YES
force_local_logins_ssl=YES
