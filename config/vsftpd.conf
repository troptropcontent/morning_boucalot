# vsftpd config for the X-E5 FTP offload feature.
#
# Templated by bin/setup_ftp_server — the __ALL_CAPS__ placeholders below
# get substituted with real values when that script runs. If you ever edit
# /etc/vsftpd.conf by hand on the server, re-running the script will
# overwrite it — make changes here and re-run instead.

listen=YES
listen_ipv6=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES

# vsftpd refuses to let a system user without a real login shell in unless
# told not to check — the dedicated FTP user created by the setup script
# has /usr/sbin/nologin on purpose (it should never be able to SSH in).
check_shell=NO

# Single dedicated FTP user (created by the setup script), locked to its
# own folder — it can't see or write anywhere else on the server.
chroot_local_user=YES
allow_writeable_chroot=YES
local_root=__FTP_INCOMING_DIR__

# vsftpd's default umask (077) would leave uploaded files readable only by
# ftpcam, so the Rails job container (reading the same files through a
# bind mount, as a different user) can't open them. 027 gives the file's
# group read access instead — paired with the setgid bit the setup script
# puts on the incoming directory, which makes every upload inherit that
# group automatically. See bin/setup_ftp_server's FTP_READ_GID.
local_umask=027

# Passive mode: the camera opens the data connection back to us, so vsftpd
# has to advertise our real address and a fixed port range — open that
# same range in the VPS firewall, alongside port 21. Widened from the
# original 10-port range as a precaution for bulk laptop uploads (each
# file gets its own passive port, and a lingering TIME_WAIT can tie one
# up for ~60s after use) — though the actual "broken pipe" bug hit in
# practice turned out to be require_ssl_reuse below, not port exhaustion.
pasv_enable=YES
pasv_address=__PASV_ADDRESS__
pasv_min_port=__PASV_MIN_PORT__
pasv_max_port=__PASV_MAX_PORT__

# Off by default in vsftpd — without this there's nothing to look at when
# something goes wrong (confirmed empty journalctl during today's bulk
# upload failure). xferlog_std_format writes vsftpd's own log instead of
# only syslog, in the common wu-ftpd-style one-line-per-transfer format.
syslog_enable=NO
xferlog_enable=YES
xferlog_std_format=NO
log_ftp_protocol=YES
vsftpd_log_file=/var/log/vsftpd.log

# FTPES: encrypted login + transfer over ordinary port 21 (not implicit
# FTPS on 990). Set the camera to "FTPES" / "FTP over TLS (explicit)".
ssl_enable=YES
rsa_cert_file=__SSL_CERT_FILE__
rsa_private_key_file=__SSL_KEY_FILE__
force_local_data_ssl=YES
force_local_logins_ssl=YES

# vsftpd's default demands the data connection's TLS session match/reuse
# the control connection's (a hijacking defense) — modern TLS 1.3 clients,
# including macOS curl/LibreSSL, don't reliably satisfy this. Symptom
# confirmed on this server: control login succeeds, the data-channel TLS
# handshake itself succeeds, STOR is accepted ("150 Ok to send data"),
# then the very first byte written gets a broken pipe — vsftpd silently
# killing the connection over the reuse mismatch, not a network problem.
require_ssl_reuse=NO
