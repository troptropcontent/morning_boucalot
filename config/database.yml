default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  primary:
    <<: *default
    database: db/development.sqlite3
  queue:
    <<: *default
    database: db/queue.sqlite3
    migrations_paths: db/queue_migrate

test:
  <<: *default
  database: db/test.sqlite3

production:
  primary:
    adapter: postgresql
    url: <%= ENV["DATABASE_URL"] %>
  queue:
    adapter: postgresql
    url: <%= ENV["QUEUE_DATABASE_URL"] %>
    migrations_paths: db/queue_migrate
